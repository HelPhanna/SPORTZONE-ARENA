<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/user-layout}">
<head>
    <title>Login</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card auth-card shadow-sm p-4">
                <div class="text-center mb-4">
                    <div class="auth-logo-badge" title="Sign In to SportZone Arena">
                        <i class="bi bi-box-arrow-in-right"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Sign In</h3>
                    <p class="text-muted small mb-0">Welcome back to <span class="fw-semibold text-dark">SportZone Arena</span></p>
                </div>

                <form th:action="@{/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="email" name="email" class="form-control"
                                   placeholder="name@example.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" id="password" name="password" class="form-control"
                                   placeholder="Enter your password" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </div>

                    <!-- Demo Accounts Quick Info -->
                    <div class="alert alert-light border small text-muted mb-3">
                        <div class="fw-bold text-dark mb-1"><i class="bi bi-info-circle me-1"></i>Demo Accounts:</div>
                        <div><strong>Admin:</strong> admin@sportbooking.com / Admin@123</div>
                        <div><strong>User:</strong> user@sportbooking.com / User@123</div>
                    </div>

                    <div class="text-center">
                        <span class="text-muted">Don't have an account?</span>
                        <a th:href="@{/register}" class="fw-bold text-decoration-none">Create Account</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
