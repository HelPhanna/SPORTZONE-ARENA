<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title th:text="'Edit ' + ${user.name} + ' - Admin'">Edit Account</title>
</head>
<body>
<div layout:fragment="page-title">Edit User Account</div>

<div layout:fragment="content">
    <div class="mb-4">
        <a th:href="@{/admin/users}" class="btn btn-outline-secondary btn-sm rounded-pill px-3 mb-2">
            <i class="bi bi-arrow-left me-1"></i> Back to Accounts
        </a>
        <div class="d-flex align-items-center gap-3 flex-wrap">
            <h3 class="fw-bold text-dark mb-0" th:text="'Edit Account: ' + ${user.name}">
                Edit Account
            </h3>
            <span class="badge bg-light text-muted border">ID: <span th:text="${user.id}">1</span></span>
        </div>
        <p class="text-muted mb-0">Update customer credentials, role permissions, and access status.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="admin-card">
                <div class="admin-card-header">
                    <h5 class="admin-card-title">
                        <i class="bi bi-person-gear text-primary"></i>
                        <span>Account Information</span>
                    </h5>
                </div>
                <div class="admin-card-body p-4">
                    <form th:action="@{'/admin/users/' + ${user.id} + '/edit'}" method="post">
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-dark">Full Name <span class="text-danger">*</span></label>
                                <input type="text" name="name" th:value="${user.name}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-dark">Email Address <span class="text-danger">*</span></label>
                                <input type="email" name="email" th:value="${user.email}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-dark">Phone Number</label>
                                <input type="text" name="phone" th:value="${user.phone}" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-dark">Reset Password (Optional)</label>
                                <input type="password" name="newPassword" class="form-control" placeholder="Leave blank to keep current password">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-dark">Account Role <span class="text-danger">*</span></label>
                                <select name="role" class="form-select">
                                    <option th:each="r : ${roles}"
                                            th:value="${r}"
                                            th:selected="${user.role == r}"
                                            th:text="${r.name()}">ROLE</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-dark">Account Status <span class="text-danger">*</span></label>
                                <select name="status" class="form-select">
                                    <option th:each="st : ${statuses}"
                                            th:value="${st}"
                                            th:selected="${user.status == st}"
                                            th:text="${st.name()}">STATUS</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/admin/users}" class="btn btn-outline-secondary rounded-pill px-4">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary rounded-pill px-5 shadow-sm">
                                <i class="bi bi-check2-circle me-1"></i> Update Account
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
