<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title th:text="'Edit ' + ${category.name} + ' - Admin'">Edit Sport Category</title>
</head>
<body>
<div layout:fragment="page-title">Edit Category</div>

<div layout:fragment="content">
    <div class="mb-4">
        <a th:href="@{/admin/categories}" class="btn btn-outline-secondary btn-sm rounded-pill px-3 mb-2">
            <i class="bi bi-arrow-left me-1"></i> Back to Categories
        </a>
        <div class="d-flex align-items-center gap-3 flex-wrap">
            <h3 class="fw-bold text-dark mb-0" th:text="'Edit Category: ' + ${category.name}">
                Edit Category
            </h3>
            <span class="badge bg-light text-muted border">ID: <span th:text="${category.id}">1</span></span>
        </div>
        <p class="text-muted mb-0">Update sport category title, visual media, and operational status.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="admin-card">
                <div class="admin-card-header">
                    <h5 class="admin-card-title">
                        <i class="bi bi-pencil-square text-primary"></i>
                        <span>Modify Category</span>
                    </h5>
                </div>
                <div class="admin-card-body p-4">
                    <form th:action="@{'/admin/categories/' + ${category.id} + '/edit'}" method="post">
                        <div class="row g-3 mb-4">
                            <div class="col-md-8">
                                <label class="form-label small fw-semibold text-dark">Category Name <span class="text-danger">*</span></label>
                                <input type="text" name="name" th:value="${category.name}" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold text-dark">Status</label>
                                <select name="status" class="form-select">
                                    <option th:each="st : ${statuses}"
                                            th:value="${st}"
                                            th:selected="${category.status == st}"
                                            th:text="${st.name()}">STATUS</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-semibold text-dark">Category Image / Banner Path</label>
                                <input type="text" name="image" th:value="${category.image}" class="form-control" placeholder="e.g. /img/categories/football.jpg">
                                <small class="text-muted">Relative path from /img or external image URL.</small>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-semibold text-dark">Description</label>
                                <textarea name="description" rows="4" class="form-control" th:text="${category.description}"></textarea>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/admin/categories}" class="btn btn-outline-secondary rounded-pill px-4">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary rounded-pill px-5 shadow-sm">
                                <i class="bi bi-check2-circle me-1"></i> Update Category
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
