<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/user-layout}">
<head>
    <title>500 - Server Error</title>
</head>
<body>
<div layout:fragment="content" class="text-center py-5">
    <div class="display-1 text-danger fw-bold mb-3"><i class="bi bi-exclamation-triangle"></i> 500</div>
    <h2 class="fw-bold mb-3">Internal Server Error</h2>
    <p class="text-muted lead mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred while processing your request.'}"></p>
    <a th:href="@{/}" class="btn btn-primary px-4"><i class="bi bi-house me-2"></i>Return to Home</a>
</div>
</body>
</html>
