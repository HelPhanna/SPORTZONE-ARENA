<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/user-layout}">
<head>
    <title>404 - Page Not Found</title>
</head>
<body>
<div layout:fragment="content" class="text-center py-5">
    <div class="display-1 text-warning fw-bold mb-3"><i class="bi bi-question-circle"></i> 404</div>
    <h2 class="fw-bold mb-3">Page Not Found</h2>
    <p class="text-muted lead mb-4">The resource or page you are looking for does not exist or has been moved.</p>
    <a th:href="@{/}" class="btn btn-primary px-4"><i class="bi bi-house me-2"></i>Return to Home</a>
</div>
</body>
</html>
