server.port=8080

# ------------------------------------------------------------------------------
# Import .env file from project root (just like Node/Express dotenv)
# ------------------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

# MySQL DataSource (reads values from .env)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3309/sport_booking}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf & Messages
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# File Upload Configuration
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB

# Application Custom Properties
app.upload-dir=uploads
app.name=SportZone Arena

# ==============================================================================
# BAKONG KHQR PAYMENT GATEWAY CONFIGURATION (TESTING / MOCK)
# ==============================================================================
# 
# 1. ENVIRONMENT / MODE TOGGLE:
# ------------------------------------------------------------------------------
# Set to 'true' for local development, offline demos, or university presentations.
#   - Shows the green "Simulate Instant Payment" button on the booking confirmation screen.
#   - Does not require a live network call or active token to confirm payments.
# Set to 'false' for production or testing with real money:
#   - Hides the simulation button.
#   - Polls the National Bank of Cambodia (NBC) Bakong Open API in real-time.
#   - Requires a valid 'bakong.token' below.
bakong.mock-mode=true

# 2. NBC BAKONG OPEN API SETTINGS:
# ------------------------------------------------------------------------------
# The base URL for the National Bank of Cambodia Bakong Open API (v1).
# Production & Sandbox Gateway: https://api-bakong.nbc.gov.kh/v1
bakong.api-url=https://api-bakong.nbc.gov.kh/v1

# Developer Bearer JWT Token issued by the NBC Bakong Developer Portal.
# Register and generate your token at: https://api-bakong.nbc.gov.kh/
# Leave blank when bakong.mock-mode=true or set in .env as BAKONG_TOKEN.
bakong.token=${BAKONG_TOKEN:}

# 3. BAKONG MERCHANT TESTING CREDENTIALS:
# ------------------------------------------------------------------------------
bakong.account-id=sportzone@aba
bakong.merchant-name=SPORTZONE ARENA
bakong.merchant-city=Phnom Penh
bakong.acquiring-bank=Bakong
bakong.mcc=5999
bakong.currency=USD
